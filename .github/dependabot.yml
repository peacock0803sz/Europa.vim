version: 2
updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ":arrow_up:"

  # uv (Python) in tests/
  - package-ecosystem: uv
    directory: tests/
    schedule:
      interval: weekly
    commit-message:
      prefix: ":arrow_up:"
