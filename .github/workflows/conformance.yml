on:
  pull_request:
    paths:
      - 'denops/europa/kernel/**'
      - 'schema/message.ts'
      - 'schema/session.ts'
      - 'schema/config.ts'
      - 'schema/connection-file.ts'
      - 'contracts/kernel-client.ts'
      - 'contracts/dispatcher.ts'
      - 'tests/pyproject.toml'
      - 'tests/uv.lock'
      - 'tests/conformance/**'
      - 'tests/fixtures/mock-kernel.ts'
      - 'tests/fixtures/mock-host.ts'
      - 'tests/fixtures/mock-zmq-kernel.ts'
      - 'tests/fixtures/mock-zmq-codec.ts'
      - 'tests/spec/kernel/**'
      - 'denops/europa/main.ts'
      - 'denops/europa/session/state.ts'
      - 'denops/europa/session/events.ts'
      - 'plugin/commands.vim'
      - 'autoload/europa.vim'
      - 'doc/europa-configuration.txt'
      - 'doc/europa-commands.txt'
      - 'doc/europa-kernel.txt'
      - '.github/workflows/conformance.yml'
      - 'deno.json'
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "tests/uv.lock"

      - run: |
          uv sync --project tests
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$PWD/tests/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/tests/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Cache Deno deps
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}

      - name: Run conformance tests
        run: deno task test:conformance --shuffle
        env:
          NO_COLOR: '1'

      # ubuntu only: zeromq prebuilt binaries are reliable on Linux x86-64, but
      # the native build is flaky on the macOS/Windows runners, so the ZMQ e2e
      # runs on a single lane. The cross-OS step above stays FFI-free.
      - name: Run ZMQ attach conformance (ubuntu only)
        if: runner.os == 'Linux'
        run: |
          deno install --allow-scripts=npm:zeromq
          deno task test:conformance:zmq
        env:
          NO_COLOR: '1'
