on:
  pull_request:
    paths:
      - 'denops/europa/kernel/**'
      - 'schema/message.ts'
      - 'schema/session.ts'
      - 'schema/config.ts'
      - 'contracts/kernel-client.ts'
      - 'contracts/dispatcher.ts'
      - 'tests/pyproject.toml'
      - 'tests/uv.lock'
      - 'tests/conformance/**'
      - 'tests/fixtures/mock-kernel.ts'
      - 'tests/fixtures/mock-host.ts'
      - 'tests/spec/kernel/**'
      - 'denops/europa/main.ts'
      - 'denops/europa/session/state.ts'
      - 'denops/europa/session/events.ts'
      - 'plugin/commands.vim'
      - 'autoload/europa.vim'
      - 'doc/europa-configuration.txt'
      - 'doc/europa-commands.txt'
      - 'doc/europa-kernel.txt'
      - '.github/workflows/conformance.yml'
      - 'deno.json'
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conformance:
    # A hung kernel_info handshake once kept a macOS job alive for the full
    # 360-minute default. Bound the job, and the test step separately so a hang
    # still leaves the deno test output and the cache post-step behind.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.13', '3.14']
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "tests/uv.lock"

      - run: |
          uv sync --project tests
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$PWD/tests/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/tests/.venv/bin" >> "$GITHUB_PATH"
          fi

      - name: Cache Deno deps
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}

      - name: Run conformance tests
        timeout-minutes: 10
        run: deno task test:conformance --shuffle
        env:
          NO_COLOR: '1'
          # Multiply every wall-clock budget in tests/conformance/timeouts.ts.
          # Local runs stay strict at the default of 1 so a real performance
          # regression still shows up somewhere.
          EUROPA_CONFORMANCE_TIMEOUT_SCALE: '4'
          # Nine spec files boot a real jupyter server — eight directly and
          # orphan_prevention_spec through the watchdog — so the default
          # parallelism (one worker per CPU) starts 8-12 CPU-bound Python
          # processes at once on a 3-4 vCPU runner and starves ipykernel.
          # Two workers halve that while keeping the suite parallel.
          DENO_JOBS: '2'
          # phase=http_ready elapsed_ms is the only measurement we have of how
          # starved a runner is; ~30 extra log lines buys that signal.
          EUROPA_SPAWN_TRACE: '1'
