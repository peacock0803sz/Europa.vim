name: e2e

on:
  pull_request:
    paths:
      - 'denops/europa/kernel/**'
      - 'schema/message.ts'
      - 'schema/session.ts'
      - 'schema/config.ts'
      - 'contracts/kernel-client.ts'
      - 'contracts/dispatcher.ts'
      - 'tests/conformance/**'
      - 'tests/fixtures/mock-kernel.ts'
      - 'tests/fixtures/mock-host.ts'
      - 'tests/spec/kernel/**'
      - 'denops/europa/main.ts'
      - 'denops/europa/session/state.ts'
      - 'denops/europa/session/events.ts'
      - 'plugin/commands.vim'
      - 'autoload/europa.vim'
      - 'doc/sources/04-configuration.txt'
      - 'doc/sources/05-commands.txt'
      - 'doc/sources/07-kernel.txt'
      - '.github/workflows/e2e.yml'
      - 'deno.json'
  schedule:
    - cron: '0 18 * * *'  # 03:00 JST nightly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: e2e
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install jupyter-server + ipykernel
        run: |
          python -m pip install --upgrade pip
          pip install 'jupyter-server>=2.15,<3.0' 'ipykernel>=7.0,<8.0'

      - name: Cache Deno deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/deno
          key: ${{ runner.os }}-deno-${{ hashFiles('deno.lock') }}

      - name: Run conformance tests
        run: deno task test:conformance --shuffle
        env:
          NO_COLOR: '1'
