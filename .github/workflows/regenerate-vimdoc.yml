on:
  pull_request:
    types: [opened, synchronize, reopened]

defaults:
  run:
    shell: bash

concurrency:
  group: regenerate-vimdoc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: ${{ github.event.pull_request.user.login == 'renovate[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Regenerate doc/europa.txt
        run: deno task gen:vimdoc

      - name: Commit and push if doc/europa.txt changed
        run: |
          if [[ -n "$(git status --short doc/europa.txt)" ]]; then
            git add doc/europa.txt
            git commit -m ":memo: Regenerate doc/europa.txt"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "doc/europa.txt is up to date; skipping commit"
          fi
