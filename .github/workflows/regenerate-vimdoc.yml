on:
  pull_request:
    types: [opened, synchronize, reopened]

defaults:
  run:
    shell: bash

concurrency:
  group: regenerate-vimdoc-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: ${{ github.event.pull_request.user.login == 'renovate[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/deno
            ~/.deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}
          restore-keys: deno-${{ runner.os }}-

      - name: Regenerate doc/europa-api.txt
        run: deno task gen:vimdoc

      - name: Commit and push if doc/europa-api.txt changed
        run: |
          if [[ -n "$(git status --short doc/europa-api.txt)" ]]; then
            git add doc/europa-api.txt
            git commit -m ":memo: Regenerate doc/europa-api.txt"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "doc/europa-api.txt is up to date; skipping commit"
          fi
