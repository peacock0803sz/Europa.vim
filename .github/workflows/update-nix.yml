on:
  workflow_dispatch:
  schedule:
    - cron: 0 18 * * * # everyday 03:00 JST
defaults:
  run:
    shell: bash

jobs:
  update-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: peacock0803sz
      GIT_AUTHOR_EMAIL: 33555487+peacock0803sz@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Update flake inputs
        run: |
          nix flake update

          if [[ -z $(git status --untracked-files --short) ]]; then
            echo "Nothing to commit"
            exit 0
          fi

          git add flake.lock
          git commit -m ":snowflake: Update flake.lock"
          git push origin HEAD
